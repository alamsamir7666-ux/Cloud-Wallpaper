# Render blueprint for the Cloudimage search bridge — the FALLBACK option.
#
# Fly.io is the recommended host (no 15-minute sleep death, ~2-5 s wake
# vs ~30-60 s, Mumbai region). See scripts/search-bridge/DEPLOY.md.
#
# Render free web services sleep after 15 minutes of inactivity; the app's
# 160 s call timeout survives the wake-up, but the first search after an
# idle pause answers in ~30-60 s.
services:
  - type: web
    name: cloudimage-search
    runtime: docker
    plan: free
    region: singapore # closest Render region to Bangladesh
    rootDir: scripts/search-bridge
    dockerfilePath: ./Dockerfile.searxng
    dockerContext: .
    # The combined image (SearXNG + bridge) needs no secrets at all —
    # unlimited keyless search. Render injects PORT automatically.
    envVars:
      - key: SEARCH_PROVIDER
        value: searxng
