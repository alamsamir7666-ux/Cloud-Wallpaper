# Render blueprint for the Cloudimage search bridge — the no-credit-card
# permanent deploy. See scripts/search-bridge/DEPLOY.md for the full
# step-by-step walkthrough.
#
# Free plan facts: 512 MB RAM / 0.1 CPU, sleeps after 15 idle minutes,
# wakes in ~30-60 s (the app's 160 s call timeout absorbs it). Docker
# builds run on Render's remote builder — no local Docker needed, and
# this combined image needs NO secrets, NO API keys, NO Google.
services:
  - type: web
    name: cloudimage-search
    runtime: docker
    plan: free
    region: singapore # closest Render region to Bangladesh

    # Paths are relative to the REPO ROOT (Render blueprint spec) — the
    # combined image lives in scripts/search-bridge/.
    dockerfilePath: ./scripts/search-bridge/Dockerfile.searxng
    dockerContext: ./scripts/search-bridge

    # Memory calibration for the 512 MB free instance: SearXNG measures
    # ~175-220 MB RSS; the bridge gets a 64 MB V8 heap cap (baked into
    # the image) plus this 80 MB image-cache budget.
    envVars:
      - key: SEARCH_PROVIDER
        value: searxng
      - key: PROXY_CACHE_BUDGET_MB
        value: "80"
