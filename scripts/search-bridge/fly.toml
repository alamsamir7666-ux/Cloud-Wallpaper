# fly.io configuration for the Cloudimage search bridge.
#
# Deploy from THIS directory (scripts/search-bridge/):
#
#   fly auth login
#   fly apps create cloudimage-search   # pick another name if taken — update here too
#   fly secrets set GOOGLE_CSE_KEY=... GOOGLE_CSE_CX=...
#   fly deploy
#
# Full runbook: DEPLOY.md in this directory.

app = "cloudimage-search" # must be globally unique on fly.dev
primary_region = "bom"    # Mumbai — closest region to Bangladesh ("sin" = Singapore fallback)

[env]
  # Keep the V8 heap well inside the 256 MB machine so the image proxy's
  # buffers always have headroom.
  NODE_OPTIONS = "--max-old-space-size=160"

[http_service]
  internal_port = 3000
  force_https = true

  # Cost-saver default: the machine sleeps when idle and wakes in a few
  # seconds on the next request (a stopped machine costs nothing). If your
  # account still has the legacy hobby free allowance (3 tiny always-on
  # VMs), prefer zero cold start instead:
  #   auto_stop_machines = false
  #   min_machines_running = 1
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
