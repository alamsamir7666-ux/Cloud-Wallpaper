# fly.io configuration for the Cloudimage search bridge.
#
# Deploy from THIS directory (scripts/search-bridge/):
#
#   fly auth login
#   fly apps create cloudimage-search   # pick another name if taken — update here too
#   fly deploy
#
# That's the whole deploy — the bundled SearXNG provider needs no secrets,
# no API keys, no quotas. Full runbook: DEPLOY.md in this directory.

app = "cloudimage-search" # must be globally unique on fly.dev
primary_region = "bom"    # Mumbai — closest region to Bangladesh ("sin" = Singapore fallback)

[build]
  # Combined image: SearXNG (internal :8080) + the bridge (public :3000).
  dockerfile = "Dockerfile.searxng"

[env]
  # Memory calibration for the 512 MB machine: SearXNG measures
  # ~175-220 MB RSS; the bridge gets a 64 MB V8 heap cap (baked into the
  # image) plus this 80 MB image-cache budget.
  PROXY_CACHE_BUDGET_MB = "80"

[http_service]
  internal_port = 3000
  force_https = true

  # Cost-saver default: the machine sleeps when idle and wakes in a few
  # seconds on the next request (a stopped machine costs nothing). If your
  # account still has the legacy hobby free allowance (3 tiny always-on
  # VMs), prefer zero cold start instead:
  #   auto_stop_machines = false
  #   min_machines_running = 1
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
