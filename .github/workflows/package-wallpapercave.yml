name: package wallpapercave extension

# Builds the fixed WallpaperCave provider package (v1.2.1 — preview-family
# thumbs) and uploads it as an artifact. The app itself does not bundle
# this provider; the package is published to the extension repository
# (Cloud-wallpaper-Bundles gh-pages) from the artifact, where installed
# copies pick it up as an update (versionCode 4 > 3).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build extension package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package provider
        run: ./gradlew :providers:wallpapercave:packageExtension --no-daemon

      - name: Unit tests
        run: ./gradlew :providers:wallpapercave:test --no-daemon

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: wallpapercave-extension
          path: providers/wallpapercave/build/outputs/extension/*.zip
          if-no-files-found: error
