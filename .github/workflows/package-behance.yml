name: package behance extension

# Builds the Behance provider package and uploads it as an artifact.
# The app itself does not bundle this provider; the package is published
# to the extension repository (Cloud-wallpaper-Bundles gh-pages) from the
# artifact, where it installs as a new source.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build extension package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package provider
        run: ./gradlew :providers:behance:packageExtension --no-daemon

      - name: Unit tests
        run: ./gradlew :providers:behance:test --no-daemon

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: behance-extension
          path: providers/behance/build/outputs/extension/*.zip
          if-no-files-found: error
